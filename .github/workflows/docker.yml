# Builds the multi-stage jWar image and publishes it to GHCR on every
# semver-style git tag.
#
# Triggers:
#   - push tag matching `v*`  ->  builds + pushes ghcr.io/fhgomes/jwar:<tag>
#                                 and `:latest`
#   - workflow_dispatch       ->  manual run; supports `build_native` input
#                                 (reserved for the future runtime-native
#                                 stage -- disabled by default).
#
# Security note: all dynamic values are workflow context refs the actions
# below treat as trusted (tag refs, github.actor, GITHUB_TOKEN); no
# attacker-controllable input (issue titles, PR bodies, commit messages)
# is ever interpolated into a `run:` block.

name: Build & Publish Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_native:
        description: "Also build the runtime-native (GraalVM) variant"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fhgomes/jwar

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push (runtime stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Reserved hook for the optional GraalVM native-image variant.
      # The Dockerfile does not yet expose a `runtime-native` target; this
      # step is intentionally a no-op and will be wired up once FR-014 of
      # spec 011 lands.
      - name: Build & push (runtime-native stage) -- placeholder
        if: ${{ inputs.build_native == true }}
        run: |
          echo "::warning::runtime-native target not yet implemented in Dockerfile (FR-014)"
