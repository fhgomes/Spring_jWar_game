server:
  port: 8080
  shutdown: graceful
  # since version 2.3, Spring Boot hides the message field in the response to avoid leaking sensitive information
  error.include-message: always
  # This is required in order for X-Forwarded-* headers to be handled properly.
  forward-headers-strategy: framework

logging:
  level:
    ROOT: 'INFO'
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlationId:-}] [%t] %-40.40logger{39} : %m%n"

spring:
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:dev}"
  application:
    name: jwar-server-sb
  datasource:
    url: "${DB_URL:jdbc:postgresql://${JWARSV_APP_DB_HOST:localhost}:${JWARSV_APP_DB_PORT:5432}/${JWARSV_APP_DB_NAME:jwarsv_db_dev}}"
    username: "${DB_USERNAME:${JWARSV_APP_DB_USER:ujwarsvdev}}"
    password: "${DB_PASSWORD:${JWARSV_APP_DB_PW:jwarsv_dev_pw}}"
    driverClassName: org.postgresql.Driver

    hikari:
      maximumPoolSize: 10
      maxLifetime: 180000 #3 minutes
      idleTimeout: 50000

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.show_sql: false
      hibernate.format_sql: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      READ_UNKNOWN_ENUM_VALUES_USING_DEFAULT_VALUE: true
      fail-on-unknown-properties: false
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

  flyway:
    locations: classpath:db/migration
    enabled: true

  cache:
    type: caffeine
    caffeine:
      spec: "maximumSize=10000, expireAfterAccess=60s"

  thymeleaf:
    mode: HTML

  mail:
    from: 'no-reply@bnuuywar.com'
    host: 'mail.bnuuywar.com'
    port: 465
    username: 'no-reply@bnuuywar.com'
    password: "${JWARSV_APP_EMAIL_PW:abc}"
    properties:
      mail:
        debug: false
        transport.protocol: smtp
        smtp:
          auth: false
          starttls:
            enable: true

app:
  base-url: "${APP_BASE_URL:http://localhost:8080}"
  firebase:
    service-account-path: "${FB_SERVICE_ACCOUNT_PATH:${JWARSV_APP_FB_KEY:}}"
    project-id: "${FB_PROJECT_ID:}"
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}"
  realtime:
    turn-timeout-seconds: 90
    replay-buffer-size: 50
  rate-limit:
    register-per-minute: 5
    login-per-minute: 10
    gameplay-per-minute: 30
  backoffice:
    allowed_users: "fgomes"
    master_pw: "${JWARSV_APP_BACKOFFICE_MASTER_PW:}"

# ===================================================================
# actuator
# ===================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  jmx:
    exposure:
      exclude: "*"

# ===================================================================
# Springdoc OpenAPI
# ===================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
