server {
    listen 80;  # Listen on HTTP port
    server_name api.localhost.prod api.bnuuywar.com api-v2.bnuuywar.com api.localhost.qa localhost qa-api.bnuuywar.com qa-api-v2.bnuuywar.com;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;  # Use a 301 redirect
}
