upstream backend-prod {
       server host.docker.internal:8080;
}

upstream backend-dev {
       server host.docker.internal:8081;
}

server {
    listen       443 ssl;
    ssl_certificate /etc/nginx/ssl/cloudflaresigned.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflaresigned.key;
    server_name  api.localhost.qa localhost qa-api.bnuuywar.com;

    # Add SSL options
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    index index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/html/public;

    charset   utf-8;

    gzip on;
    gzip_vary on;
    gzip_disable "msie6";
    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss;

    location /api/ {
        proxy_pass  http://backend-dev;
    }

    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|svg|woff|woff2|ttf)\$ {
      expires 1M;
      access_log off;
      add_header Cache-Control "public";
    }

    location ~* \.(?:css|js)\$ {
      expires 7d;
      access_log off;
      add_header Cache-Control "public";
    }

    location ~ /\.ht {
        deny  all;
    }
}

server {
    listen       443 ssl;
    ssl_certificate /etc/nginx/ssl/cloudflaresigned.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflaresigned.key;
